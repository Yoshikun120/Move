<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI สรุปหนัง</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2e38; --text:#f2f3f5; --mute:#9aa0ac; --accent:#ff5a3c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Noto Sans Thai",system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:22px; margin:8px 0 4px; }
  p.sub { color:var(--mute); margin:0 0 20px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--mute); margin:12px 0 6px; }
  label:first-child { margin-top:0; }
  select, input[type=number], input[type=file] { width:100%; padding:11px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; }
  button { width:100%; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#fff; font:inherit; font-weight:600; font-size:16px; cursor:pointer; margin-top:16px; }
  button:disabled { opacity:.5; cursor:default; }
  .bar { height:10px; background:var(--bg); border-radius:99px; overflow:hidden; margin:12px 0 8px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .4s; }
  .msg { font-size:14px; color:var(--mute); }
  .err { color:#ff8a7a; }
  video { width:100%; max-height:70vh; border-radius:12px; background:#000; }
  a.dl { display:block; text-align:center; text-decoration:none; padding:14px; border-radius:12px; background:#22c55e; color:#04210f; font-weight:700; margin-top:12px; }
  ol { padding-left:20px; margin:8px 0 0; font-size:14px; color:var(--mute); }
  ol li { margin-bottom:6px; }
  .hidden { display:none; }
  .note { font-size:12px; color:var(--mute); margin-top:12px; line-height:1.5; }
</style>
</head>
<body>
<main>
  <h1>🎬 AI สรุปหนัง</h1>
  <p class="sub">อัปโหลดวิดีโอ แล้วรับคลิปแนวตั้ง 9:16 พร้อมพากย์ไทย ซับ และเอฟเฟกต์</p>

  <form id="form" class="card">
    <label>ไฟล์วิดีโอ (ต้องมีเสียงพูด)</label>
    <input type="file" id="file" accept="video/*" required>

    <label>สไตล์</label>
    <select id="style">
      <option value="spoil">สปอยหนัง (เล่าถึงตอนจบ)</option>
      <option value="summary">สรุปเนื้อเรื่อง (เป็นกลาง)</option>
      <option value="teaser">ทีเซอร์ (ไม่บอกตอนจบ)</option>
    </select>

    <label>ความยาวคลิป (วินาที)</label>
    <input type="number" id="length" value="60" min="20" max="180">

    <label>เสียงพากย์</label>
    <select id="voice">
      <option value="female">ผู้หญิง (เปรมวดี)</option>
      <option value="male">ผู้ชาย (นิวัฒน์)</option>
    </select>

    <button id="go" type="submit">สร้างคลิป</button>
    <div class="note">ใช้เฉพาะวิดีโอที่คุณมีสิทธิ์นำไปใช้ หนังหรือคลิปของคนอื่นอาจโดนเคลมลิขสิทธิ์เมื่อลงแพลตฟอร์ม</div>
  </form>

  <section id="progress" class="card hidden">
    <div class="msg" id="msg">เริ่มทำงาน...</div>
    <div class="bar"><div id="fill"></div></div>
  </section>

  <section id="result" class="card hidden">
    <video id="player" controls playsinline></video>
    <a id="dl" class="dl" href="#" download>⬇ บันทึกคลิป</a>
    <label style="margin-top:16px">โครงเรื่องที่ AI วางไว้</label>
    <ol id="scenes"></ol>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData();
  fd.append("file", $("file").files[0]);
  fd.append("style", $("style").value);
  fd.append("length", $("length").value);
  fd.append("voice", $("voice").value);
  $("go").disabled = true;
  $("result").classList.add("hidden");
  $("progress").classList.remove("hidden");
  $("msg").className = "msg"; $("msg").textContent = "กำลังอัปโหลด..."; $("fill").style.width = "2%";
  try {
    const r = await fetch("/api/jobs", { method: "POST", body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || "อัปโหลดไม่สำเร็จ");
    poll((await r.json()).id);
  } catch (err) { fail(err.message); }
});

function fail(m) {
  $("msg").className = "msg err"; $("msg").textContent = "เกิดข้อผิดพลาด: " + m; $("go").disabled = false;
}

async function poll(id) {
  try {
    const j = await (await fetch("/api/jobs/" + id)).json();
    $("fill").style.width = (j.progress || 0) + "%";
    if (j.status === "error") return fail(j.message);
    if (j.status === "done") {
      $("msg").textContent = "เสร็จแล้ว";
      $("player").src = j.download; $("dl").href = j.download;
      $("scenes").innerHTML = "";
      (j.plan.scenes || []).forEach(s => { const li = document.createElement("li"); li.textContent = s.narration; $("scenes").appendChild(li); });
      $("result").classList.remove("hidden"); $("go").disabled = false;
      return;
    }
    $("msg").textContent = j.message || "กำลังทำงาน...";
  } catch (e) {}
  setTimeout(() => poll(id), 2000);
}
</script>
</body>
</html>
